<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario · Negocio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/globals.css">
    <style>
      
    </style>
  </head>
  <body>
    <!-- ── HEADER ────────────────────────────────────── -->
    <header>
      <h1 class="logo">Stock<span>·</span>Pro</h1>
      <div class="header-right">
        <button id="themeToggle">
          <span id="toggleIcon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
          <span id="toggleLabel">Claro</span>
        </button>
        <button id="btnNuevo">+ Producto</button>
      </div>
    </header>

    <!-- ── MAIN ──────────────────────────────────────── -->
    <div class="wrapper">
      <!-- DASHBOARD -->
      <section class="dashboard" id="dashboard">
        <div class="stat">
          <div class="stat-label">Total productos</div>
          <div class="stat-val yellow" id="statTotal">0</div>
          <div class="stat-sub">SKUs únicos</div>
        </div>
        <div class="stat">
          <div class="stat-label">Valor inventario</div>
          <div class="stat-val green" id="statValor">$0</div>
          <div class="stat-sub">precio × stock</div>
        </div>
        <div class="stat">
          <div class="stat-label">Stock bajo</div>
          <div class="stat-val red" id="statBajo">0</div>
          <div class="stat-sub">menos de 5 unidades</div>
        </div>
        <div class="stat">
          <div class="stat-label">Precio promedio</div>
          <div class="stat-val blue" id="statProm">$0</div>
          <div class="stat-sub">por unidad</div>
        </div>
      </section>

      <!-- TOOLBAR -->
      <div class="toolbar">
        <input
          type="text"
          id="busqueda"
          placeholder="Buscar por nombre o categoría…"
          autocomplete="off"
        />
        <button class="sort-btn active" data-sort="nombre">A→Z nombre</button>
        <button class="sort-btn" data-sort="precio">Precio ↑</button>
        <button class="sort-btn" data-sort="stock">Stock ↑</button>
        <span class="items-count" id="itemsCount">0 productos</span>
      </div>

      <!-- TABLA -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th style="text-align: center">Stock</th>
              <th style="text-align: right">Precio unit.</th>
              <th style="text-align: right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            <tr id="emptyRow">
              <td colspan="6">Sin productos — agrega el primero <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" style="vertical-align: middle; margin-left: 0.3rem"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── MODAL ──────────────────────────────────────── -->
    <div
      class="modal-overlay"
      id="modalOverlay"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal">
        <h2 class="modal-title" id="modalTitle">Nuevo <span>Producto</span></h2>
        <input type="hidden" id="editId" />

        <div class="field">
          <label for="fNombre">Nombre del producto</label>
          <input
            type="text"
            id="fNombre"
            placeholder="Ej. Café molido 500g"
            maxlength="80"
          />
          <p class="field-error" id="errNombre"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="fPrecio">Precio unitario ($)</label>
            <input
              type="number"
              id="fPrecio"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
            <p class="field-error" id="errPrecio"></p>
          </div>
          <div class="field">
            <label for="fStock">Stock (unidades)</label>
            <input type="number" id="fStock" placeholder="0" min="0" step="1" />
            <p class="field-error" id="errStock"></p>
          </div>
        </div>

        <div class="field">
          <label for="fCategoria">Categoría</label>
          <select id="fCategoria">
            <option value="General">General</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Limpieza">Limpieza</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Ropa">Ropa</option>
            <option value="Papelería">Papelería</option>
            <option value="Salud">Salud</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" id="btnCancelar">Cancelar</button>
          <button class="btn-save" id="btnGuardar">Guardar</button>
        </div>
      </div>
    </div>

    <!-- ── TOASTS ─────────────────────────────────────── -->
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- ── JAVASCRIPT ─────────────────────────────────── -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
